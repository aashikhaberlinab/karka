  <path d="M11 14 18 24" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M37 14 30 24" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M18 24 24 33" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M18 35h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M24 33V14" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <!-- rising star / accent dot -->
  <circle cx="24" cy="10.5" r="3.4" fill="url(#lb)"/>
  <!-- Wordmark -->
  <text x="60" y="22" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#0F172A" letter-spacing="-0.4">You Aspirant</text>
  <text x="61" y="37" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1.4">CAREER GUIDANCE &amp; TRAINING</text>
